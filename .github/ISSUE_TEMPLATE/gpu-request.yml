name: GPU booking
description: Book GPU cards on a lab node. Filing this issue is the booking; no approval needed.
title: "[GPU] "
labels: ["gpu-request"]
body:
  - type: markdown
    attributes:
      value: |
        Filing this issue books the cards for the dates below. Check the dashboard's calendar first so you pick a free window.
        Dates are inclusive, in `YYYY-MM-DD`. Close this issue when you are done early (it releases the cards).
  - type: dropdown
    id: node
    attributes:
      label: Node
      options:
        - ada6000
        - Lab2
    validations:
      required: true
  - type: input
    id: cards
    attributes:
      label: Cards
      description: How many GPUs on that node
      placeholder: "1"
      value: "1"
    validations:
      required: true
  - type: input
    id: start
    attributes:
      label: Start date
      placeholder: "2026-10-21"
    validations:
      required: true
  - type: input
    id: end
    attributes:
      label: End date
      placeholder: "2026-10-25"
    validations:
      required: true
  - type: input
    id: gpuids
    attributes:
      label: GPU ids
      description: Optional. Which physical cards (nvidia-smi indices), e.g. "0,2". Leave empty to take the lowest free cards.
      placeholder: "0,2"
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: What experiment, expected VRAM, whether it can be preempted
      placeholder: "LoRA fine-tune of LLaMA-7B, ~40 GB VRAM, fine to run overnight"
    validations:
      required: true
